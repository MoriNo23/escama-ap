version: 2
updates:
  # El proyecto no tiene manifiesto de dependencias Python (stdlib puro);
  # lo unico versionado que se actualiza son las actions del CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    # Un solo PR semanal para todas las actions del CI, menos ruido.
    groups:
      github-actions:
        patterns:
          - "*"
